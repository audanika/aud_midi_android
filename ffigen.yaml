# Generates the AMidi bindings of aud_midi_android:
# lib/src/amidi/midi_android_amidi_bindings.g.dart.
#
# Regenerate after changing this file (see README.md):
#
#   NDK="$HOME/Library/Android/sdk/ndk/28.2.13676358"
#   SYSROOT="$NDK/toolchains/llvm/prebuilt/darwin-x86_64/sysroot"
#   dart run ffigen --config ffigen.yaml \
#     --compiler-opts "--target=aarch64-linux-android33 --sysroot=$SYSROOT"
#
# libamidi.so is opened at runtime with DynamicLibrary.open, only on API 29+.

name: MidiAndroidAMidiBindings
description: The NDK AMidi API, libamidi.so, API 29 and later.
output: lib/src/amidi/midi_android_amidi_bindings.g.dart
headers:
  entry-points:
    - ffigen/amidi.h
  include-directives:
    - "**/amidi/AMidi.h"
compiler-opts-automatic:
  macos:
    include-c-standard-library: false
functions:
  include:
    - "AMidi.*"
enums:
  as-int:
    include:
      - ".*"
unnamed-enums:
  include:
    - "AMIDI_.*"
# AMidiDevice_Protocol and media_status_t are 32-bit on every Android ABI.
silence-enum-warning: true
structs:
  include:
    - "AMidi.*"
  dependency-only: opaque
unions:
  include:
    - "AMidi.*"
  dependency-only: opaque
preamble: |
